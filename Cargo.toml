[package]
name = "botapi"
version = "0.0.85"
edition = "2021"
authors = ["Alex Ballmer <gnu3ra@riseup.net"]
description = "A mildly competent autogenerated telegram bot api wrapper"
homepage = "https://github.com/fmeef/botapi-rs"
repository = "https://github.com/fmeef/botapi-rs.git"
license = "MIT"

include = [
    "src/**/*",
    "Cargo.toml",
    "./examples/**/*",
    "generate/src/**/*",
    "generate/Cargo.toml",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
enum_dispatch = "0.3.13"
reqwest = { version = "0.12.28", features = ["json", "multipart", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["unbounded_depth"] }
tokio = { version = "1.53.1", features = [
    "net",
    "socket2",
    "io-util",
    "tokio-macros",
    "macros",
    "rt-multi-thread",
] }
serde_urlencoded = "0.7.1"
async-stream = "0.3.6"
futures-core = { version = "0.3.34", features = ["cfg-target-has-atomic"] }
futures-util = "0.3.34"
hyper = { version = "1.11.0", features = ["server", "http2"] }
rand = "0.9.5"
uuid = "1.25.0"
rmp-serde = "1.3.1"
tokio-test = "0.4.5"
ordered-float = { version = "5.5.0", features = ["serde"] }
serde_stacker = "0.1.14"
rhai = { version = "1.25.1", optional = true, features = ["internals"] }
log = "0.4.34"
http-body-util = "0.1.5"
hyper-util = { version = "0.1.20", features = ["server", "tokio"] }

[build-dependencies]
tggen = { path = "./generate", version = "0.0.85" }
anyhow = "1.0.104"

[features]
rhai = ["dep:rhai"]
